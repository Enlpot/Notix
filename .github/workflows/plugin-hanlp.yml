name: Build HanLP Plugin

# v8.46.0：插件与主版本解耦——插件 zip 挂固定 release tag plugin-hanlp，URL 恒定。
# 仅在 plugins/ 目录变更或手动触发时构建并覆盖上传，不影响主版本发布。

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
  workflow_dispatch:  # 手动触发

permissions:
  contents: write

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build HanLP plugin package
        run: |
          # 构建插件模块（自动拉取 HanLP 依赖）
          ./gradlew :plugins:word-tokenizer:assembleRelease
          # 定位 HanLP jar（gradle 缓存）
          HANLP_JAR=$(find "$HOME/.gradle/caches" -name "hanlp-portable-1.6.8.jar" | head -1)
          if [ -z "$HANLP_JAR" ]; then
            echo "::error::HanLP jar not found in gradle cache"
            exit 1
          fi
          echo "HanLP jar: $HANLP_JAR"
          # 插件模块的 classes.jar
          PLUGIN_JAR=plugins/word-tokenizer/build/intermediates/aar_main_jar/release/syncReleaseLibJars/classes.jar
          if [ ! -f "$PLUGIN_JAR" ]; then
            echo "::error::Plugin classes.jar not found: $PLUGIN_JAR"
            exit 1
          fi
          # 定位 d8（Android SDK build-tools）
          D8=$(find "$ANDROID_SDK_ROOT/build-tools" -name "d8" -type f | sort -V | tail -1)
          if [ -z "$D8" ]; then
            echo "::error::d8 not found in ANDROID_SDK_ROOT"
            exit 1
          fi
          echo "Using d8: $D8"
          # 合并插件类 + HanLP 类转 dex
          mkdir -p plugin_dist
          "$D8" --output plugin_dist --min-api 26 "$PLUGIN_JAR" "$HANLP_JAR"
          # 整理：重命名 dex、提取词典、打包单 zip
          cd plugin_dist
          mv classes.dex word_tokenizer_hanlp.dex
          unzip -q "$HANLP_JAR" "data/*"
          zip -qr word_tokenizer_hanlp.zip word_tokenizer_hanlp.dex data
          echo "Plugin zip: $(du -h word_tokenizer_hanlp.zip | cut -f1)"
          cd ..
          ls -la plugin_dist/

      - name: Upload to fixed plugin release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 固定 release tag：plugin-hanlp（不随主版本变化，URL 恒定可被镜像源引用）
          TAG="plugin-hanlp"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "HanLP 分词插件" \
              --notes "HanLP 分词插件独立发行（不随主版本变化）。固定下载地址：https://github.com/Enlpot/Notix/releases/download/plugin-hanlp/word_tokenizer_hanlp.zip"
          fi
          # 覆盖上传（asset 名恒定）
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber plugin_dist/word_tokenizer_hanlp.zip
