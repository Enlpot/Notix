name: Auto Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for tags

      - name: Check if release exists
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, skipping"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Release v$VERSION does not exist, will build and release"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history and tags for release notes

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Notix signing keystore
        env:
          NOTIX_KEYSTORE_BASE64: ${{ secrets.NOTIX_KEYSTORE_BASE64 }}
          NOTIX_KEYSTORE_PASSWORD: ${{ secrets.NOTIX_KEYSTORE_PASSWORD }}
          NOTIX_KEYSTORE_KEYPASSWORD: ${{ secrets.KEYSTORE_NOTIX_KEYPASSWORD }}
          NOTIX_KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_NOTIX_ALIAS }}
        run: |
          if [ -n "$NOTIX_KEYSTORE_BASE64" ]; then
            echo "$NOTIX_KEYSTORE_BASE64" | base64 -d > app/notix-release.jks
            echo "KEYSTORE_NOTIX_FILE=$PWD/app/notix-release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_NOTIX_PASSWORD=$NOTIX_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEYSTORE_NOTIX_KEYPASSWORD=$NOTIX_KEYSTORE_KEYPASSWORD" >> $GITHUB_ENV
            echo "KEYSTORE_NOTIX_ALIAS=$NOTIX_KEYSTORE_ALIAS" >> $GITHUB_ENV
          else
            echo "::warning::NOTIX_KEYSTORE_BASE64 is not configured; the release build will not be signed"
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease


      - name: Rename APK with version
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          cd app/build/outputs/apk/release/
          # Find the APK (could be app-release.apk or app-release-unsigned.apk)
          APK_FILE=$(ls *.apk | head -1)
          mv "$APK_FILE" "Notix-v${VERSION}.apk"

      - name: Generate release notes
        id: notes
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          # Find the previous tag - robust matching for both v8.38 and v8.38.0 formats
          # Strategy: list tags sorted by date descending, find first tag whose version < current version
          PREV_TAG=""
          CURRENT_MAJOR=$(echo "$VERSION" | cut -d. -f1)
          CURRENT_MINOR=$(echo "$VERSION" | cut -d. -f2)
          CURRENT_PATCH=$(echo "$VERSION" | cut -d. -f3)
          for tag in $(git tag --sort=-creatordate | grep -E "^v[0-9]"); do
            TAG_VER=$(echo "$tag" | sed 's/^v//')
            TAG_MAJOR=$(echo "$TAG_VER" | cut -d. -f1)
            TAG_MINOR=$(echo "$TAG_VER" | cut -d. -f2)
            TAG_PATCH=$(echo "$TAG_VER" | cut -d. -f3)
            TAG_PATCH=${TAG_PATCH:-0}
            # Compare versions: tag version < current version
            if [ "$TAG_MAJOR" -lt "$CURRENT_MAJOR" ] 2>/dev/null || \
               { [ "$TAG_MAJOR" -eq "$CURRENT_MAJOR" ] 2>/dev/null && [ "$TAG_MINOR" -lt "$CURRENT_MINOR" ] 2>/dev/null; } || \
               { [ "$TAG_MAJOR" -eq "$CURRENT_MAJOR" ] 2>/dev/null && [ "$TAG_MINOR" -eq "$CURRENT_MINOR" ] 2>/dev/null && [ "$TAG_PATCH" -lt "$CURRENT_PATCH" ] 2>/dev/null; }; then
              PREV_TAG="$tag"
              break
            fi
          done
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Previous tag: $PREV_TAG"
          
          # v8.42.3：优先从 RELEASE_NOTES.md 提取对应版本的详细更新说明
          # 提取失败时回退到 git log 自动生成
          NOTES_FROM_FILE=""
          if [ -f RELEASE_NOTES.md ]; then
            # 提取 ## v${VERSION} 到下一个 ## v 之间的内容（不含标题行和分隔线）
            NOTES_FROM_FILE=$(awk "/^## v${VERSION}/{flag=1; next} /^## v/{flag=0} flag" RELEASE_NOTES.md | grep -v "^---$" | grep -v "^$")
          fi

          if [ -n "$NOTES_FROM_FILE" ]; then
            # 从 RELEASE_NOTES.md 提取成功，使用详细内容
            echo -e "# Notix v${VERSION} 发布说明\n\n${NOTES_FROM_FILE}" > RELEASE_NOTES_GENERATED.md
          else
            # 提取失败，回退到 git log 自动生成
            NOTES="# Notix v${VERSION} 发布说明\n\n"
            NOTES+="本次版本相较于上一版本的更新内容：\n\n"
            NOTES+="## 更新内容\n\n"
            ALL_COMMITS=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD)
            FEATS=$(echo "$ALL_COMMITS" | grep -iE "^- (feat|功能|新增|add|实现)" || true)
            FIXES=$(echo "$ALL_COMMITS" | grep -iE "^- (fix|修复|bug|解决)" || true)
            IMPROVED=$(echo "$ALL_COMMITS" | grep -iE "^- (优化|改进|improve|perf|refactor|style|调整)" || true)
            CHORES=$(echo "$ALL_COMMITS" | grep -iE "^- (chore|docs|test|升版|v[0-9])" || true)
            if [ -n "$FEATS" ]; then
              NOTES+="### 新增功能\n$FEATS\n\n"
            fi
            if [ -n "$IMPROVED" ]; then
              NOTES+="### 改进优化\n$IMPROVED\n\n"
            fi
            if [ -n "$FIXES" ]; then
              NOTES+="### 问题修复\n$FIXES\n\n"
            fi
            if [ -n "$CHORES" ]; then
              NOTES+="### 维护更新\n$CHORES\n\n"
            fi
            echo -e "$NOTES" > RELEASE_NOTES_GENERATED.md
          fi
          cat RELEASE_NOTES_GENERATED.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body_path: RELEASE_NOTES_GENERATED.md
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



